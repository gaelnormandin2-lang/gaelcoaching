<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quel programme est fait pour toi ?</title>
<style>
  :root {
    --bg: #0A0A0A;
    --bg-soft: #1A1A1A;
    --card: #EDEDEB;
    --card-ink: #101010;
    --accent-soft: #A3E635;
    --muted: #8C8C8C;
    --line: rgba(237,237,235,0.14);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: Arial, sans-serif;
    background: var(--bg);
    background-image: radial-gradient(circle at 15% 10%, var(--bg-soft) 0%, var(--bg) 55%);
    color: #F5F5F3;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
  }

  .wrap { width: 100%; max-width: 560px; }

  .steps {
    display: flex;
    gap: 8px;
    margin-bottom: 28px;
  }
  .step-dot {
    flex: 1;
    height: 3px;
    background: var(--line);
    border-radius: 2px;
    overflow: hidden;
    position: relative;
  }
  .step-dot::after {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--accent-soft);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.4s ease;
  }
  .step-dot.done::after, .step-dot.active::after { transform: scaleX(1); }

  h1 {
    font-family: 'Arial Black', Arial, sans-serif;
    font-weight: 900;
    font-size: clamp(24px, 5vw, 32px);
    line-height: 1.15;
    margin-bottom: 8px;
  }

  .sub {
    color: var(--muted);
    font-size: 15px;
    margin-bottom: 28px;
    line-height: 1.5;
  }

  .card {
    background: var(--card);
    color: var(--card-ink);
    border-radius: 18px;
    padding: 28px 24px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.45);
  }

  .q-title {
    font-family: 'Arial Black', Arial, sans-serif;
    font-size: 19px;
    font-weight: 900;
    margin-bottom: 20px;
    line-height: 1.3;
  }

  .options { display: flex; flex-direction: column; gap: 10px; }

  .option {
    text-align: left;
    background: #ffffff;
    border: 1px solid rgba(16,16,16,0.12);
    border-left: 3px solid rgba(16,16,16,0.12);
    border-radius: 10px;
    padding: 14px 16px;
    font-family: Arial, sans-serif;
    font-size: 15px;
    font-weight: 500;
    color: var(--card-ink);
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
  }
  .option:hover {
    border-left-color: var(--card-ink);
    background: #f7f7f6;
  }
  .option:active { transform: scale(0.99); }

  .nav-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 22px;
  }
  .back-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-family: Arial, sans-serif;
    font-size: 14px;
    cursor: pointer;
    padding: 6px 0;
  }
  .back-btn:hover { color: var(--card-ink); }
  .back-btn:disabled { visibility: hidden; }

  .count { color: var(--muted); font-size: 13px; }

  /* Contact form */
  .field-group { margin-bottom: 14px; }
  .field-label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 6px;
    color: var(--card-ink);
  }
  .field-input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid rgba(16,16,16,0.18);
    background: #ffffff;
    font-family: Arial, sans-serif;
    font-size: 15px;
    color: var(--card-ink);
  }
  .field-input:focus { outline: 2px solid var(--accent-soft); }
  .submit-btn {
    width: 100%;
    background: var(--card-ink);
    color: #F5F5F3;
    font-family: 'Arial Black', Arial, sans-serif;
    font-weight: 900;
    font-size: 15px;
    border: none;
    border-radius: 10px;
    padding: 15px;
    cursor: pointer;
    margin-top: 6px;
  }
  .submit-btn:hover { background: #000000; }
  .form-note {
    font-size: 12.5px;
    color: #6f6f6d;
    margin-top: 12px;
    line-height: 1.4;
  }

  /* Result screen */
  .result-tag {
    display: inline-block;
    font-family: 'Arial Black', Arial, sans-serif;
    font-size: 12px;
    letter-spacing: 0.02em;
    color: #ffffff;
    background: var(--card-ink);
    padding: 5px 12px;
    border-radius: 20px;
    margin-bottom: 16px;
  }
  .result-name {
    font-family: 'Arial Black', Arial, sans-serif;
    font-size: 26px;
    font-weight: 900;
    margin-bottom: 6px;
  }
  .result-delivery {
    font-size: 13px;
    color: #6f6f6d;
    font-weight: 700;
    margin-bottom: 14px;
  }
  .result-desc {
    color: #4a4a48;
    font-size: 15px;
    line-height: 1.55;
    margin-bottom: 18px;
  }
  .result-includes {
    list-style: none;
    margin-bottom: 20px;
  }
  .result-includes li {
    font-size: 14.5px;
    padding: 9px 0;
    border-top: 1px solid rgba(16,16,16,0.1);
    display: flex;
    gap: 10px;
  }
  .result-includes li:first-child { border-top: none; }
  .result-includes li::before {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent-soft);
    margin-top: 6px;
    flex-shrink: 0;
  }
  .result-price {
    font-family: 'Arial Black', Arial, sans-serif;
    font-size: 30px;
    font-weight: 900;
    margin-bottom: 18px;
  }
  .cta {
    display: block;
    width: 100%;
    text-align: center;
    background: var(--card-ink);
    color: #F5F5F3;
    font-family: 'Arial Black', Arial, sans-serif;
    font-weight: 900;
    font-size: 15.5px;
    border: none;
    border-radius: 10px;
    padding: 16px;
    cursor: pointer;
    text-decoration: none;
  }
  .cta:hover { background: #000000; }

  .cta-secondary {
    display: block;
    width: 100%;
    text-align: center;
    background: transparent;
    color: var(--card-ink);
    font-family: 'Arial Black', Arial, sans-serif;
    font-weight: 900;
    font-size: 14.5px;
    border: 1.5px solid rgba(16,16,16,0.25);
    border-radius: 10px;
    padding: 14px;
    cursor: pointer;
    text-decoration: none;
    margin-top: 10px;
  }
  .cta-secondary:hover { background: rgba(16,16,16,0.05); }

  .budget-note {
    text-align: center;
    margin-top: 16px;
    font-size: 12.5px;
    color: #6f6f6d;
  }
  .budget-note a {
    color: #6f6f6d;
    text-decoration: underline;
  }
  .budget-note a:hover { color: var(--card-ink); }

  .restart {
    display: block;
    text-align: center;
    margin-top: 24px;
    color: var(--muted);
    font-size: 13px;
    cursor: pointer;
    text-decoration: underline;
  }
</style>
</head>
<body>

<div class="wrap">
  <h1 id="headline">Quel accompagnement est fait pour toi ?</h1>
  <p class="sub" id="subline">Réponds à quelques questions rapides, je t'oriente vers ce qui correspond à ton objectif.</p>

  <div class="steps" id="steps"></div>

  <div class="card" id="card"></div>

  <div class="restart" id="restart" style="display:none" onclick="restart()">Recommencer</div>
</div>

<script>
const CALENDLY_LINK = "https://calendly.com/gaelnormandin2/30min";
const SPORT_OFFERS_LINK = "SPORT_OFFERS_LINK_HERE";

const questions = [
  {
    title: "Quel est ton objectif principal ?",
    options: [
      { text: "Perdre du poids, sécher", scores: { perte: 2 } },
      { text: "Prendre du muscle, me tonifier", scores: { performance: 2 } },
      { text: "Progresser sur mes performances sportives", scores: { performance: 2 } },
      { text: "Simplement mieux manger et retrouver de l'énergie", scores: { essentiel: 2 } }
    ]
  },
  {
    title: "Quelle est ta fréquence sportive ?",
    options: [
      { text: "1 fois/semaine", scores: { essentiel: 1 } },
      { text: "2 fois/semaine", scores: { essentiel: 1 } },
      { text: "3 fois/semaine", scores: { perte: 1 } },
      { text: "+ de 3 fois/semaine", scores: { performance: 1 } }
    ]
  },
  {
    title: "Qu'est-ce qui te freine le plus aujourd'hui ?",
    options: [
      { text: "Les fringales, difficile de contrôler mon appétit", scores: { perte: 2 } },
      { text: "Manque de motivation, difficulté à rester régulier", scores: { essentiel: 2 } },
      { text: "Le manque de temps et d'organisation dans mes repas", scores: { essentiel: 2 } },
      { text: "Mes résultats stagnent, je ne progresse plus", scores: { performance: 2 } }
    ]
  },
  {
    title: "Quel résultat veux-tu voir en premier ?",
    options: [
      { text: "Un chiffre sur la balance qui bouge", scores: { perte: 2 } },
      { text: "Voir une transformation physique visible", scores: { perte: 1, performance: 1 } },
      { text: "Plus d'énergie au quotidien", scores: { essentiel: 2 } },
      { text: "Progresser sur mes performances sportives", scores: { performance: 2 } }
    ]
  }
];

const programs = {
  essentiel: {
    tag: "Ton programme",
    name: "Programme Essentiel",
    desc: "Le point de départ idéal pour mieux manger, retrouver de l'énergie au quotidien et poser des bases solides — sans bouleverser toute ta vie.",
    includes: [
      "Petit déjeuner nutritionnel complet (Goût au choix)",
      "Ton hydratation quotidienne (Goût au choix)",
      "Accès à l'app GetFitNow",
      "Suivi personnalisé et visio"
    ],
    delivery: "Livré à la maison",
    price: "159€",
    paymentLink: "PASTE_ESSENTIEL_PAYMENT_LINK_HERE"
  },
  perte: {
    tag: "Ton programme",
    name: "Programme Perte de Poids",
    desc: "Conçu pour un objectif clair : contrôler ton appétit, limiter les fringales et voir des résultats concrets sur 21 jours.",
    includes: [
      "Petit déjeuner nutritionnel complet (Goût au choix)",
      "Ton hydratation quotidienne (Goût au choix)",
      "Boisson Multi-fibres pour booster tes résultats, aide le système immunitaire et digestifs",
      "Accès à l'app GetFitNow",
      "Suivi personnalisé et visio"
    ],
    delivery: "Livré à la maison",
    price: "265€",
    paymentLink: "PASTE_PERTE_PAYMENT_LINK_HERE"
  },
  performance: {
    tag: "Ton programme",
    name: "Programme Performance",
    desc: "Pensé pour les sportifs qui veulent progresser réellement : mieux récupérer, prendre du muscle, performer davantage.",
    includes: [
      "Petit déjeuner nutritionnel complet (Goût au choix)",
      "Ta boisson de récupération (goût chocolat) d'après séance",
      "CR7 Drive, pour ton hydratation interséance à base de glucides et d'électrolytes pour performer sur la durée",
      "Accès à l'app GetFitNow",
      "Suivi personnalisé et visio"
    ],
    delivery: "Livré à la maison",
    price: "265€",
    paymentLink: "PASTE_PERFORMANCE_PAYMENT_LINK_HERE"
  }
};

let stepIndex = 0;
let scores = { essentiel: 0, perte: 0, performance: 0 };
let history = [];
let contact = { name: "", email: "" };

function totalSteps() {
  return questions.length;
}

function renderSteps() {
  const el = document.getElementById('steps');
  el.innerHTML = '';
  const total = totalSteps();
  for (let i = 0; i < total; i++) {
    const dot = document.createElement('div');
    dot.className = 'step-dot' + (i < stepIndex ? ' done' : i === stepIndex ? ' active' : '');
    el.appendChild(dot);
  }
}

function renderQuestion() {
  document.getElementById('headline').textContent = "Quel accompagnement est fait pour toi ?";
  document.getElementById('subline').textContent = "Réponds à quelques questions rapides, je t'oriente vers ce qui correspond à ton objectif.";
  document.getElementById('restart').style.display = 'none';
  renderSteps();

  const q = questions[stepIndex];
  const card = document.getElementById('card');
  card.innerHTML = `
    <div class="q-title">${q.title}</div>
    <div class="options">
      ${q.options.map((opt, i) => `<button class="option" onclick="answer(${i})">${opt.text}</button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="back-btn" ${stepIndex === 0 ? 'disabled' : ''} onclick="goBack()">← Retour</button>
      <span class="count">${stepIndex + 1} / ${totalSteps()}</span>
    </div>
  `;
}

function start() {
  stepIndex = 0;
  renderQuestion();
}

function answer(index) {
  const q = questions[stepIndex];
  const opt = q.options[index];
  history.push(opt.scores);
  for (const key in opt.scores) scores[key] += opt.scores[key];
  stepIndex++;

  if (stepIndex < questions.length) {
    renderQuestion();
  } else {
    renderContactForm();
  }
}

function goBack() {
  const last = history.pop();
  if (!last) return;
  for (const key in last) scores[key] -= last[key];
  stepIndex--;
  renderQuestion();
}

function renderContactForm() {
  document.getElementById('headline').textContent = "Presque fini";
  document.getElementById('subline').textContent = "Laisse-nous tes coordonnées pour découvrir ton résultat et réserver ton point avec Gaël.";
  document.getElementById('steps').innerHTML = '';
  document.getElementById('restart').style.display = 'none';

  const card = document.getElementById('card');
  card.innerHTML = `
    <div class="field-group">
      <label class="field-label">Prénom</label>
      <input class="field-input" id="contact-name" type="text" placeholder="Ton prénom">
    </div>
    <div class="field-group">
      <label class="field-label">Email</label>
      <input class="field-input" id="contact-email" type="email" placeholder="ton@email.com">
    </div>
    <button class="submit-btn" onclick="submitContact()">Voir mon résultat</button>
    <div class="nav-row">
      <button class="back-btn" onclick="goBack()">← Retour</button>
      <span class="count"></span>
    </div>
  `;
}

function submitContact() {
  const name = document.getElementById('contact-name').value.trim();
  const email = document.getElementById('contact-email').value.trim();
  if (!name || !email) {
    alert("Merci de remplir ton prénom et ton email pour voir ton résultat.");
    return;
  }
  contact = { name, email };
  renderResult();
}

function renderResult() {
  document.getElementById('headline').textContent = "Voici ce qui te correspond";
  document.getElementById('subline').textContent = "Réserve ton point avec Gaël pour démarrer ton accompagnement.";
  document.getElementById('steps').innerHTML = '';
  document.getElementById('restart').style.display = 'block';

  let winnerKey = 'essentiel';
  let max = -1;
  for (const key in scores) {
    if (scores[key] > max) { max = scores[key]; winnerKey = key; }
  }

  const p = programs[winnerKey];
  const bookingUrl = CALENDLY_LINK +
    (CALENDLY_LINK.includes('?') ? '&' : '?') +
    'name=' + encodeURIComponent(contact.name) +
    '&email=' + encodeURIComponent(contact.email);

  const card = document.getElementById('card');
  card.innerHTML = `
    <div class="result-tag">${p.tag}</div>
    <div class="result-name">${p.name}</div>
    ${p.delivery ? `<div class="result-delivery">${p.delivery}</div>` : ''}
    <div class="result-desc">${p.desc}</div>
    <ul class="result-includes">
      ${p.includes.map(item => `<li>${item}</li>`).join('')}
    </ul>
    <div class="result-price">${p.price}</div>
    <a class="cta" href="${bookingUrl}">Réserver un visio avant de démarrer</a>
    <a class="cta-secondary" href="${p.paymentLink}">Je démarre directement</a>
    <div class="budget-note">Budget trop serré ? <a href="${SPORT_OFFERS_LINK}">Découvre nos options sport seul →</a></div>
  `;
}

function restart() {
  stepIndex = 0;
  scores = { essentiel: 0, perte: 0, performance: 0 };
  history = [];
  contact = { name: "", email: "" };
  start();
}

start();
</script>

</body>
</html>
