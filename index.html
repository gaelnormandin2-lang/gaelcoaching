<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gaël — Coach fitness & nutrition, accompagnement 21 jours</title>
<style>
  :root {
    --ink-black: #10131F;
    --ink-soft: #1B2136;
    --lime: #A3E635;
    --paper: #F3F1EA;
    --paper-ink: #14201A;
    --stone: #6B6F69;
    --line-dark: rgba(243,241,234,0.12);
    --line-light: rgba(20,32,26,0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    font-family: Arial, sans-serif;
    color: var(--paper-ink);
    background: var(--paper);
    line-height: 1.5;
  }

  h1, h2, h3, .accent-num {
    font-family: 'Arial Black', Arial, sans-serif;
    font-weight: 900;
  }

  a { color: inherit; }

  .container {
    max-width: 780px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* NAV */
  nav {
    position: sticky;
    top: 0;
    z-index: 50;
    background: var(--ink-black);
    color: var(--paper);
    border-bottom: 1px solid var(--line-dark);
  }
  .nav-inner {
    max-width: 780px;
    margin: 0 auto;
    padding: 16px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .nav-logo {
    font-family: 'Arial Black', Arial, sans-serif;
    font-size: 16px;
    color: var(--lime);
    text-decoration: none;
  }
  .nav-links {
    display: flex;
    gap: 20px;
    font-size: 14px;
    flex-wrap: wrap;
  }
  .nav-links a { text-decoration: none; color: var(--paper); }
  .nav-links a:hover { color: var(--lime); }
  .nav-cta {
    background: var(--lime);
    color: var(--ink-black);
    font-weight: 700;
    font-size: 13.5px;
    padding: 9px 16px;
    border-radius: 6px;
    text-decoration: none;
    white-space: nowrap;
  }

  /* SECTIONS - dark vs light rhythm */
  section { padding: 76px 0; }
  .dark { background: var(--ink-black); color: var(--paper); }
  .dark .stone { color: #9aa39c; }
  .light { background: var(--paper); color: var(--paper-ink); }
  .light .stone { color: var(--stone); }

  .tag {
    display: inline-block;
    font-size: 13.5px;
    color: var(--stone);
    margin-bottom: 18px;
  }
  .dark .tag { color: #9aa39c; }

  h1 {
    font-size: clamp(32px, 6vw, 52px);
    line-height: 1.08;
    max-width: 12ch;
    margin-bottom: 20px;
  }
  h2 {
    font-size: clamp(24px, 4vw, 34px);
    line-height: 1.15;
    max-width: 16ch;
    margin-bottom: 22px;
  }
  p.lead {
    font-size: 17px;
    max-width: 52ch;
    color: var(--stone);
  }
  .dark p.lead { color: #b7c0b9; }

  .btn-row { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 30px; }
  .btn {
    display: inline-block;
    padding: 15px 26px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 15px;
    text-decoration: none;
    cursor: pointer;
  }
  .btn-primary { background: var(--lime); color: var(--ink-black); }
  .btn-primary:hover { background: #8fd12b; }
  .btn-outline-dark {
    border: 1.5px solid rgba(243,241,234,0.3);
    color: var(--paper);
    background: transparent;
  }
  .btn-outline-dark:hover { border-color: var(--lime); color: var(--lime); }
  .btn-outline-light {
    border: 1.5px solid rgba(20,32,26,0.25);
    color: var(--paper-ink);
    background: transparent;
  }
  .btn-outline-light:hover { border-color: var(--paper-ink); }

  /* METHOD STEPS */
  .steps { margin-top: 40px; display: flex; flex-direction: column; gap: 0; }
  .step {
    display: grid;
    grid-template-columns: 56px 1fr;
    gap: 20px;
    padding: 26px 0;
    border-top: 1px solid var(--line-dark);
  }
  .step:last-child { border-bottom: 1px solid var(--line-dark); }
  .accent-num { font-size: 22px; color: var(--lime); }
  .step h3 { font-size: 18px; margin-bottom: 6px; }
  .step p { color: #b7c0b9; font-size: 15px; max-width: 50ch; }

  /* INCLUDES GRID */
  .grid-includes {
    margin-top: 36px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: var(--line-light);
    border: 1px solid var(--line-light);
  }
  .grid-includes div {
    background: var(--paper);
    padding: 22px;
    font-size: 15px;
  }
  @media (max-width: 560px) {
    .grid-includes { grid-template-columns: 1fr; }
  }

  /* RESULTS */
  .stats-row {
    display: flex;
    gap: 32px;
    flex-wrap: wrap;
    margin: 40px 0;
  }
  .stat { min-width: 100px; }
  .stat .num { font-family: 'Arial Black', Arial, sans-serif; font-size: 34px; color: var(--lime); }
  .stat .label { font-size: 13px; color: #9aa39c; margin-top: 4px; }

  .quote-card {
    background: var(--ink-soft);
    border-radius: 10px;
    padding: 26px;
    margin-top: 20px;
  }
  .quote-card p { font-size: 16px; margin-bottom: 12px; }
  .quote-card .who { font-size: 13.5px; color: #9aa39c; }
  .quote-placeholder {
    font-size: 13.5px;
    color: #7c857e;
    font-style: italic;
    margin-top: 10px;
  }

  /* OFFERS */
  .offer-card {
    border: 1.5px solid var(--line-light);
    border-radius: 10px;
    padding: 28px;
    margin-top: 22px;
  }
  .offer-card .offer-name { font-size: 20px; margin-bottom: 6px; }
  .offer-card .offer-price {
    font-family: 'Arial Black', Arial, sans-serif;
    font-size: 26px;
    margin: 14px 0;
  }
  .offer-card ul { list-style: none; margin: 14px 0; }
  .offer-card li {
    font-size: 14.5px;
    padding: 8px 0;
    border-top: 1px solid var(--line-light);
    display: flex;
    gap: 8px;
  }
  .offer-card li:first-child { border-top: none; }
  .offer-card li::before {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--lime);
    margin-top: 7px;
    flex-shrink: 0;
  }
  .offer-delivery { font-size: 12.5px; color: var(--stone); margin-bottom: 4px; }

  .flavor-picker { margin: 16px 0; }
  .flavor-label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .flavor-select {
    width: 100%;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1.5px solid var(--line-light);
    background: #ffffff;
    font-family: Arial, sans-serif;
    font-size: 14.5px;
    color: var(--paper-ink);
  }

  .sport-note {
    margin-top: 32px;
    padding: 20px;
    border-left: 3px solid var(--lime);
    background: rgba(163,230,53,0.08);
    font-size: 14.5px;
  }
  .sport-note a { font-weight: 700; text-decoration: underline; }

  .quiz-banner {
    margin-top: 40px;
    background: var(--ink-black);
    color: var(--paper);
    border-radius: 12px;
    padding: 32px 28px;
    text-align: center;
  }
  .quiz-banner h3 { font-size: 20px; margin-bottom: 14px; }

  /* QUALIFIER */
  .qual-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 32px;
    margin-top: 30px;
  }
  @media (max-width: 560px) {
    .qual-grid { grid-template-columns: 1fr; }
  }
  .qual-grid h3 { font-size: 17px; margin-bottom: 14px; }
  .qual-grid ul { list-style: none; }
  .qual-grid li {
    font-size: 14.5px;
    padding: 9px 0;
    border-top: 1px solid var(--line-light);
    color: var(--stone);
  }
  .qual-grid li:first-child { border-top: none; }

  /* DISCLAIMER */
  .disclaimer {
    font-size: 13px;
    color: #9aa39c;
    max-width: 60ch;
    line-height: 1.6;
  }
  .disclaimer strong { color: var(--paper); }

  /* FOOTER */
  footer {
    background: var(--ink-black);
    color: #8b948d;
    padding: 40px 0;
    font-size: 13.5px;
  }
  .footer-row {
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
    align-items: center;
  }
  .footer-links { display: flex; gap: 18px; flex-wrap: wrap; }
  .footer-links a { text-decoration: none; }
  .footer-links a:hover { color: var(--lime); }
</style>
</head>
</head>
<body>

<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script>
  if (window.netlifyIdentity) {
    window.netlifyIdentity.on("init", user => {
      if (!user) {
        window.netlifyIdentity.on("login", () => {
          document.location.href = "/admin/";
        });
      }
    });
  }
</script>

<nav>
  <div class="nav-inner">
    <a class="nav-logo" href="#top">GAËL</a>
    <div class="nav-links">
      <a href="#histoire">Mon histoire</a>
      <a href="#resultats">Résultats</a>
      <a href="#offres">Offres</a>
      <a href="#faq">FAQ</a>
    </div>
    <a class="nav-cta" href="#offres">Réserver un appel</a>
  </div>
</nav>

<section class="dark" id="top">
  <div class="container">
    <span class="tag" id="hero-tag"></span>
    <h1 id="hero-title"></h1>
    <p class="lead" id="hero-subtitle"></p>
    <div class="btn-row">
      <a class="btn btn-primary" href="#offres" id="hero-cta-primary"></a>
      <a class="btn btn-outline-dark" id="hero-cta-secondary"></a>
    </div>
  </div>
</section>

<section class="light">
  <div class="container">
    <span class="tag" id="promesse-tag"></span>
    <h2 id="promesse-title"></h2>
    <p class="lead" id="promesse-p1"></p>
    <p class="lead" id="promesse-p2" style="margin-top:16px;"></p>
  </div>
</section>

<section class="dark">
  <div class="container">
    <span class="tag" id="method-tag"></span>
    <h2 id="method-title"></h2>
    <div class="steps" id="method-steps"></div>
  </div>
</section>

<section class="light">
  <div class="container">
    <span class="tag" id="includes-tag"></span>
    <h2 id="includes-title"></h2>
    <div class="grid-includes" id="includes-list"></div>
  </div>
</section>

<section class="dark" id="resultats">
  <div class="container">
    <span class="tag" id="results-tag"></span>
    <h2 id="results-title"></h2>
    <div class="stats-row" id="results-stats"></div>
    <div class="quote-card">
      <p id="results-quote"></p>
      <div class="who" id="results-quote-who"></div>
    </div>
    <div class="quote-placeholder" id="results-placeholder"></div>
  </div>
</section>

<section class="light" id="offres">
  <div class="container">
    <span class="tag" id="offers-tag"></span>
    <h2 id="offers-title"></h2>

    <div id="offers-list"></div>

    <div class="sport-note" id="sport-note"></div>

    <div class="quiz-banner">
      <h3 id="quiz-banner-title"></h3>
      <a class="btn btn-primary" id="quiz-banner-btn"></a>
    </div>
  </div>
</section>

<section class="dark" id="histoire">
  <div class="container">
    <span class="tag" id="histoire-tag"></span>
    <h2 id="histoire-title"></h2>
    <p class="lead" id="histoire-p1"></p>
    <p class="lead" id="histoire-p2" style="margin-top:16px;"></p>
    <div class="btn-row">
      <a class="btn btn-primary" id="histoire-cta"></a>
    </div>
  </div>
</section>

<section class="light">
  <div class="container">
    <span class="tag" id="qualifier-tag"></span>
    <h2 id="qualifier-title"></h2>
    <div class="qual-grid">
      <div>
        <h3 id="for-you-title"></h3>
        <ul id="for-you-list"></ul>
      </div>
      <div>
        <h3 id="not-for-you-title"></h3>
        <ul id="not-for-you-list"></ul>
      </div>
    </div>
  </div>
</section>

<section class="dark" id="faq">
  <div class="container">
    <span class="tag" id="faq-tag"></span>
    <h2 id="faq-title"></h2>
    <div class="steps" id="faq-list"></div>
  </div>
</section>

<section class="light">
  <div class="container">
    <h2 id="final-title"></h2>
    <div class="btn-row">
      <a class="btn btn-outline-light" href="#offres">Voir les offres</a>
      <a class="btn btn-primary" id="final-quiz-btn">Faire le quiz</a>
    </div>
    <p class="disclaimer" style="margin-top:50px; color:var(--stone);">
      <strong style="color:var(--paper-ink);">Important —</strong> <span id="final-disclaimer"></span>
    </p>
  </div>
</section>

<footer>
  <div class="container footer-row">
    <div id="footer-brand"></div>
    <div class="footer-links">
      <a id="footer-instagram">Instagram</a>
      <a id="footer-tiktok">TikTok</a>
      <a id="footer-cgv">CGV</a>
      <a id="footer-mentions">Mentions légales</a>
    </div>
  </div>
  <div class="container" style="margin-top:16px;" id="footer-copyright"></div>
</footer>

<script>
function goToPayment(event, link, selectId, drinkSelectId) {
  event.preventDefault();
  let url = link;
  const select = document.getElementById(selectId);
  if (select) {
    url += (url.includes('?') ? '&' : '?') + 'gout_petitdej=' + encodeURIComponent(select.value);
  }
  const drinkSelect = drinkSelectId ? document.getElementById(drinkSelectId) : null;
  if (drinkSelect) {
    url += (url.includes('?') ? '&' : '?') + 'gout_boisson=' + encodeURIComponent(drinkSelect.value);
  }
  window.location.href = url;
}

fetch('./content.json')
  .then(r => r.json())
  .then(c => {
    // Hero
    document.getElementById('hero-tag').textContent = c.hero.tag;
    document.getElementById('hero-title').textContent = c.hero.title;
    document.getElementById('hero-subtitle').textContent = c.hero.subtitle;
    document.getElementById('hero-cta-primary').textContent = c.hero.cta_primary;
    document.getElementById('hero-cta-secondary').textContent = c.hero.cta_secondary;
    document.getElementById('hero-cta-secondary').href = c.hero.quiz_link;

    // Promesse
    document.getElementById('promesse-tag').textContent = c.promesse.tag;
    document.getElementById('promesse-title').textContent = c.promesse.title;
    document.getElementById('promesse-p1').textContent = c.promesse.p1;
    document.getElementById('promesse-p2').textContent = c.promesse.p2;

    // Method
    document.getElementById('method-tag').textContent = c.method.tag;
    document.getElementById('method-title').textContent = c.method.title;
    document.getElementById('method-steps').innerHTML = c.method.steps.map(s => `
      <div class="step">
        <span class="accent-num">${s.num}</span>
        <div><h3>${s.title}</h3><p>${s.desc}</p></div>
      </div>
    `).join('');

    // Includes
    document.getElementById('includes-tag').textContent = c.includes.tag;
    document.getElementById('includes-title').textContent = c.includes.title;
    document.getElementById('includes-list').innerHTML = c.includes.items.map(i => `<div>${i}</div>`).join('');

    // Results
    document.getElementById('results-tag').textContent = c.results.tag;
    document.getElementById('results-title').textContent = c.results.title;
    document.getElementById('results-stats').innerHTML = c.results.stats.map(s => `
      <div class="stat"><div class="num">${s.num}</div><div class="label">${s.label}</div></div>
    `).join('');
    document.getElementById('results-quote').textContent = '"' + c.results.quote + '"';
    document.getElementById('results-quote-who').textContent = c.results.quote_who;
    document.getElementById('results-placeholder').textContent = c.results.placeholder_note;

    // Offers
    document.getElementById('offers-tag').textContent = c.offers.tag;
    document.getElementById('offers-title').textContent = c.offers.title;
    document.getElementById('offers-list').innerHTML = c.offers.programs.map((p, idx) => `
      <div class="offer-card">
        <div class="offer-name">${p.name}</div>
        <p class="stone" style="font-size:14.5px;">${p.desc}</p>
        <div class="offer-price">${p.price}</div>
        <div class="offer-delivery">${p.delivery}</div>
        <ul>${p.items.map(i => `<li>${i}</li>`).join('')}</ul>
        ${p.flavors && p.flavors.length ? `
          <div class="flavor-picker">
            <label class="flavor-label" for="flavor-${idx}">Choisis le goût du petit-déjeuner</label>
            <select class="flavor-select" id="flavor-${idx}">
              ${p.flavors.map(f => `<option value="${f}">${f}</option>`).join('')}
            </select>
          </div>
        ` : ''}
        ${p.flavors_drink && p.flavors_drink.length ? `
          <div class="flavor-picker">
            <label class="flavor-label" for="flavor-drink-${idx}">Choisis le goût de ta boisson</label>
            <select class="flavor-select" id="flavor-drink-${idx}">
              ${p.flavors_drink.map(f => `<option value="${f}">${f}</option>`).join('')}
            </select>
          </div>
        ` : ''}
        <a class="btn btn-outline-light" href="#" onclick="goToPayment(event, '${p.link}', 'flavor-${idx}', 'flavor-drink-${idx}')">${p.button_text}</a>
      </div>
    `).join('');
    document.getElementById('sport-note').innerHTML = c.offers.sport_note.replace('découvre les options ici', `<a href="${c.offers.sport_link}">découvre les options ici</a>`);
    document.getElementById('quiz-banner-title').textContent = c.offers.quiz_banner_title;
    document.getElementById('quiz-banner-btn').textContent = c.offers.quiz_banner_button;
    document.getElementById('quiz-banner-btn').href = c.offers.quiz_link;

    // Histoire
    document.getElementById('histoire-tag').textContent = c.histoire.tag;
    document.getElementById('histoire-title').textContent = c.histoire.title;
    document.getElementById('histoire-p1').textContent = c.histoire.p1;
    document.getElementById('histoire-p2').textContent = c.histoire.p2;
    document.getElementById('histoire-cta').textContent = c.histoire.cta_text;
    document.getElementById('histoire-cta').href = c.histoire.calendly_link;

    // Qualifier
    document.getElementById('qualifier-tag').textContent = c.qualifier.tag;
    document.getElementById('qualifier-title').textContent = c.qualifier.title;
    document.getElementById('for-you-title').textContent = c.qualifier.for_you_title;
    document.getElementById('for-you-list').innerHTML = c.qualifier.for_you.map(i => `<li>${i}</li>`).join('');
    document.getElementById('not-for-you-title').textContent = c.qualifier.not_for_you_title;
    document.getElementById('not-for-you-list').innerHTML = c.qualifier.not_for_you.map(i => `<li>${i}</li>`).join('');

    // FAQ
    document.getElementById('faq-tag').textContent = c.faq.tag;
    document.getElementById('faq-title').textContent = c.faq.title;
    document.getElementById('faq-list').innerHTML = c.faq.items.map(item => `
      <div class="step" style="grid-template-columns: 1fr;">
        <div><h3>${item.q}</h3><p>${item.a}</p></div>
      </div>
    `).join('');

    // Final CTA
    document.getElementById('final-title').textContent = c.final_cta.title;
    document.getElementById('final-quiz-btn').href = c.final_cta.quiz_link;
    document.getElementById('final-disclaimer').textContent = c.final_cta.disclaimer;

    // Footer
    document.getElementById('footer-brand').textContent = c.footer.brand;
    document.getElementById('footer-instagram').href = c.footer.instagram;
    document.getElementById('footer-tiktok').href = c.footer.tiktok;
    document.getElementById('footer-cgv').href = c.footer.cgv;
    document.getElementById('footer-mentions').href = c.footer.mentions;
    document.getElementById('footer-copyright').textContent = c.footer.copyright;
  })
  .catch(err => console.error('Erreur de chargement du contenu :', err));
</script>

</body>
</html>
